<!DOCTYPE html>
<html lang="tr" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosNet - Küresel Olay Hafızası & Derinlemesine Bilgi Arşivi</title>
    <meta name="description" content="ChronosNet: Küresel gelişmeler, tarihi olayların bilinmeyen arka planı, ilişkili olaylar ve komplo teorilerinin gerçeklik analizi. Çok dilli bağımsız araştırma platformu.">
    <meta name="keywords" content="ChronosNet, olay arşivi, haber arka planı, komplo teorileri, fact check, tarihsel kronoloji, küresel olaylar">
    <meta name="author" content="ChronosNet Global">
    <meta name="robots" content="index, follow">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "ChronosNet",
      "url": "https://chronosnet.org",
      "description": "Tarihsel ve güncel olayların arka planı, kronolojisi ve teorilerinin incelendiği 7 dilli küresel bilgi platformu.",
      "knowsLanguage": ["tr", "en", "ru", "fr", "ar", "zh", "ja"]
    }
    </script>

    <style>
        :root {
            --bg-body: #070a12;
            --bg-card: #0f172a;
            --bg-card-hover: #1e293b;
            --bg-input: #1e293b;
            --border-color: #334155;
            --border-focus: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-glow: rgba(2, 132, 199, 0.25);
            --accent: #f59e0b;
            --fact-verified: #10b981;
            --fact-disputed: #f59e0b;
            --fact-debunked: #ef4444;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
            --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --bg-input: #ffffff;
            --border-color: #cbd5e1;
            --border-focus: #0284c7;
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-dim: #94a3b8;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --primary-glow: rgba(2, 132, 199, 0.15);
            --shadow-card: 0 4px 15px -2px rgba(0, 0, 0, 0.08);
            --shadow-modal: 0 20px 40px -8px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        [dir="rtl"] {
            direction: rtl;
            text-align: right;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* Top Header */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-logo-badge {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            box-shadow: 0 0 16px var(--primary-glow);
        }

        .brand-text h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-text h1 span {
            color: #38bdf8;
        }

        .brand-text p {
            font-size: 0.725rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-select, .theme-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-select:focus, .theme-btn:hover {
            border-color: var(--border-focus);
        }

        /* Breaking / Live Sources Ticker */
        .ticker-bar {
            background: rgba(2, 132, 199, 0.08);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
            font-size: 0.825rem;
        }

        .ticker-inner {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .ticker-inner::-webkit-scrollbar {
            display: none;
        }

        .ticker-label {
            background: #ef4444;
            color: white;
            font-weight: 800;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ticker-source-tag {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .ticker-source-tag strong {
            color: #38bdf8;
        }

        /* Hero & Search */
        .hero-section {
            padding: 36px 0 20px;
            text-align: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(2, 132, 199, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(2, 132, 199, 0.3);
            padding: 4px 14px;
            border-radius: 999px;
            font-size: 0.775rem;
            font-weight: 700;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hero-title {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            line-height: 1.25;
        }

        .hero-title span {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-sub {
            color: var(--text-muted);
            max-width: 680px;
            margin: 0 auto 28px;
            font-size: 1.025rem;
        }

        /* Search Controls Box */
        .search-container {
            max-width: 820px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-card);
        }

        .search-main-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-input-wrap {
            position: relative;
            flex: 1;
        }

        .search-input-wrap input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px 12px 44px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
        }

        [dir="rtl"] .search-input-wrap input {
            padding: 12px 44px 12px 16px;
        }

        .search-input-wrap input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .search-icon-svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        [dir="rtl"] .search-icon-svg {
            left: auto;
            right: 14px;
        }

        .date-filter-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .date-filter-wrap input[type="date"] {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 11px 12px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            outline: none;
        }

        .filter-buttons-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
        }

        .sort-pills, .cat-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .pill-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.785rem;
            font-weight: 600;
            cursor: pointer;
        }

        .pill-btn:hover, .pill-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* AdSense Placeholder */
        .ad-banner-slot {
            margin: 28px auto;
            max-width: 960px;
            background: var(--bg-card);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.78rem;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .ad-banner-tag {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: var(--border-color);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Dossiers Grid */
        .dossiers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .dossier-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .dossier-card:hover {
            border-color: var(--border-focus);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(0, 0, 0, 0.4);
        }

        .card-top-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.775rem;
        }

        .badge-category {
            background: rgba(2, 132, 199, 0.12);
            color: #38bdf8;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .card-views-badge {
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Fact-Check Indicator */
        .fact-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .fact-verified {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .fact-disputed {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .fact-debunked {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .dossier-title {
            font-size: 1.22rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .dossier-date {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dossier-summary {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 18px;
            flex-grow: 1;
        }

        .card-actions-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
        }

        .btn-inspect {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-inspect:hover {
            background: var(--primary-hover);
        }

        .btn-icon-action {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-icon-action:hover {
            border-color: var(--border-focus);
            color: var(--border-focus);
        }

        /* Deep-Dive Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-window {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 860px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-modal);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 24px 28px 16px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 10;
        }

        .modal-close-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        [dir="rtl"] .modal-close-btn {
            right: auto;
            left: 20px;
        }

        .modal-tabs-bar {
            display: flex;
            gap: 4px;
            background: var(--bg-input);
            padding: 4px;
            border-radius: var(--radius-md);
            margin-top: 14px;
            overflow-x: auto;
        }

        .modal-tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.825rem;
            font-weight: 700;
            border-radius: var(--radius-sm);
            cursor: pointer;
            white-space: nowrap;
        }

        .modal-tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .modal-body {
            padding: 24px 28px;
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.7;
        }

        .modal-tab-pane {
            display: none;
        }

        .modal-tab-pane.active {
            display: block;
        }

        .timeline-item {
            position: relative;
            padding-left: 24px;
            margin-bottom: 20px;
            border-left: 2px solid var(--border-focus);
        }

        [dir="rtl"] .timeline-item {
            padding-left: 0;
            padding-right: 24px;
            border-left: none;
            border-right: 2px solid var(--border-focus);
        }

        .timeline-date {
            font-weight: 800;
            color: var(--border-focus);
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .theory-item-box {
            background: var(--bg-input);
            border-left: 4px solid var(--accent);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 14px 16px;
            margin-bottom: 16px;
        }

        [dir="rtl"] .theory-item-box {
            border-left: none;
            border-right: 4px solid var(--accent);
            border-radius: var(--radius-sm) 0 0 var(--radius-sm);
        }

        .theory-title {
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .theory-factcheck {
            font-size: 0.85rem;
            color: var(--text-muted
